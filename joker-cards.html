<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Joker State — Joker Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Bungee+Inline&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Joker State · Card Showcase
   Style: Vegas Neon × Vintage Americana × CRT Pixel
   Target: 40-year-old American dudes
   ========================================================= */

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg-deep:     #16080d;
    --bg-felt:     #2a0a14;
    --bg-leather:  #4a1a20;
    --neon-red:    #ff2d55;
    --neon-blue:   #2bd1ff;
    --neon-pink:   #ff5cc1;
    --neon-green:  #4cff7d;
    --neon-amber:  #ffb02e;
    --gold:        #f6c948;
    --brass:       #c89236;
    --bone:        #f5e6c8;
    --ink:         #0a0508;
    --com:         #c8c6c2;
    --unc:         #4cff7d;
    --rar:         #2bd1ff;
    --leg:         #ff7c2a;
}

html, body {
    background: var(--bg-deep);
    color: var(--bone);
    font-family: 'VT323', monospace;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ---------- BACKGROUND: smoky bar / casino floor ---------- */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255, 45, 85, 0.18), transparent 60%),
        radial-gradient(ellipse 60% 40% at 20% 100%, rgba(43, 209, 255, 0.10), transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 80%, rgba(246, 201, 72, 0.08), transparent 60%),
        repeating-linear-gradient(45deg, var(--bg-felt) 0 10px, var(--bg-deep) 10px 20px);
    z-index: -2;
}

/* CRT scanlines */
body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: multiply;
}

/* ---------- HEADER / MARQUEE ---------- */
.marquee {
    text-align: center;
    padding: 50px 20px 20px;
    position: relative;
}

.neon-sign {
    display: inline-block;
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(36px, 6vw, 72px);
    color: var(--gold);
    letter-spacing: 4px;
    text-shadow:
        0 0 4px var(--gold),
        0 0 18px var(--neon-amber),
        0 0 38px rgba(255, 176, 46, 0.6),
        4px 4px 0 var(--ink);
    animation: flicker 4s infinite;
    transform: rotate(-1.5deg);
}

.neon-sign .red { color: var(--neon-red); text-shadow: 0 0 4px var(--neon-red), 0 0 18px var(--neon-red), 4px 4px 0 var(--ink); }
.neon-sign .blue { color: var(--neon-blue); text-shadow: 0 0 4px var(--neon-blue), 0 0 18px var(--neon-blue), 4px 4px 0 var(--ink); }

@keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.55; }
}

.subtitle {
    margin-top: 14px;
    font-family: 'Special Elite', cursive;
    color: var(--bone);
    opacity: 0.75;
    font-size: 18px;
    letter-spacing: 3px;
}

.subtitle::before, .subtitle::after { content: ' ★ '; color: var(--gold); }

.tagline {
    margin-top: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--neon-amber);
    letter-spacing: 2px;
}

/* ---------- FILTER BAR ---------- */
.filter-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 20px;
    margin-bottom: 10px;
}

.filter-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 10px 16px;
    background: var(--bg-leather);
    color: var(--bone);
    border: 2px solid var(--brass);
    border-radius: 6px;
    cursor: pointer;
    box-shadow:
        inset 0 -3px 0 rgba(0,0,0,0.4),
        0 3px 0 rgba(0,0,0,0.6);
    transition: transform 0.1s, background 0.2s;
    letter-spacing: 1px;
}
.filter-btn:hover { background: #6a2228; transform: translateY(-2px); }
.filter-btn.active { background: var(--gold); color: var(--ink); border-color: var(--bone); }

/* ---------- CARD GRID ---------- */
.collection {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 32px;
    padding: 30px clamp(16px, 4vw, 60px) 80px;
    max-width: 1600px;
    margin: 0 auto;
    perspective: 1500px;
}

/* ---------- CARD BASE ---------- */
.joker-card {
    position: relative;
    aspect-ratio: 5 / 7;
    background: linear-gradient(160deg, #1f0810, #3a1118 60%, #1a0608);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 12px;
    box-shadow:
        0 0 0 2px var(--brass),
        0 14px 0 -4px rgba(0,0,0,0.6),
        0 22px 40px -10px rgba(0,0,0,0.8),
        inset 0 0 30px rgba(0,0,0,0.6);
    transition: transform 0.35s cubic-bezier(.2,.8,.3,1.2), box-shadow 0.3s;
    cursor: pointer;
    overflow: hidden;
    transform-style: preserve-3d;
}

.joker-card:hover {
    transform: translateY(-12px) rotateZ(-1.2deg) rotateY(8deg) scale(1.04);
    box-shadow:
        0 0 0 2px var(--gold),
        0 20px 0 -4px rgba(0,0,0,0.7),
        0 30px 60px -10px rgba(255,176,46,0.4),
        inset 0 0 30px rgba(0,0,0,0.6);
    z-index: 10;
}

/* Foil shimmer overlay */
.joker-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(255,255,255,0.08) 45%,
        rgba(255,255,255,0.25) 50%,
        rgba(255,255,255,0.08) 55%,
        transparent 70%
    );
    transform: translateX(-100%);
    transition: transform 0.7s;
    pointer-events: none;
    mix-blend-mode: overlay;
}
.joker-card:hover::after { transform: translateX(100%); }

/* Inner border (frame) */
.card-frame {
    position: relative;
    height: 100%;
    border: 2px dashed rgba(246, 201, 72, 0.35);
    border-radius: 10px;
    padding: 10px 8px 8px;
    display: flex;
    flex-direction: column;
    background:
        radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 70%);
}

/* ---------- HEADER STRIP ---------- */
.card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 6px;
    border-bottom: 2px solid rgba(246,201,72,0.25);
    margin-bottom: 8px;
}

.card-name {
    font-family: 'Bungee Inline', cursive;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: var(--gold);
    text-shadow: 1px 1px 0 var(--ink), 0 0 8px rgba(246,201,72,0.5);
    line-height: 1.05;
    flex: 1;
}

.rarity-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.5);
    letter-spacing: 1px;
    color: var(--ink);
    box-shadow: 0 2px 0 rgba(0,0,0,0.5);
    flex-shrink: 0;
    margin-left: 6px;
}
.rarity-badge.com { background: var(--com); }
.rarity-badge.unc { background: var(--unc); }
.rarity-badge.rar { background: var(--rar); }
.rarity-badge.leg {
    background: linear-gradient(90deg, #ff7c2a, #ffe14e, #ff7c2a);
    background-size: 200% 100%;
    animation: foil 2.5s linear infinite;
    color: var(--ink);
}
@keyframes foil { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }

/* ---------- ART WINDOW ---------- */
.card-art {
    position: relative;
    flex: 1;
    margin: 4px 0;
    border: 2px solid var(--brass);
    border-radius: 8px;
    background:
        radial-gradient(ellipse at center, #5a1820 0%, #2a0a10 70%, #150405 100%);
    overflow: hidden;
    image-rendering: pixelated;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(0,0,0,0.6);
}

/* Halftone dot pattern in art */
.card-art::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.4) 1px, transparent 1.5px);
    background-size: 4px 4px;
    opacity: 0.5;
    pointer-events: none;
}

/* Spotlight beam */
.card-art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 50% at 50% 30%, rgba(255,220,120,0.18), transparent 70%);
    pointer-events: none;
}

.art-emoji {
    font-size: 88px;
    line-height: 1;
    filter:
        drop-shadow(2px 2px 0 #000)
        drop-shadow(0 0 10px rgba(255,176,46,0.5))
        contrast(1.1) saturate(1.2);
    transform: translateY(-4px) rotate(-3deg);
    z-index: 2;
    position: relative;
}

.art-tag {
    position: absolute;
    bottom: 6px;
    left: 6px;
    font-family: 'Special Elite', cursive;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 1px;
    z-index: 3;
}

.art-stamp {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 32px;
    height: 32px;
    border: 2px solid var(--neon-red);
    border-radius: 50%;
    color: var(--neon-red);
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(-15deg);
    opacity: 0.85;
    z-index: 3;
    text-shadow: 0 0 4px rgba(255,45,85,0.6);
    line-height: 1;
}

/* ---------- ABILITY TEXT ---------- */
.card-ability {
    margin-top: 6px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(246,201,72,0.3);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: 'VT323', monospace;
    font-size: 16px;
    line-height: 1.15;
    color: var(--bone);
    min-height: 56px;
}

.card-ability .mult { color: var(--neon-red); font-weight: bold; }
.card-ability .chip { color: var(--neon-blue); font-weight: bold; }
.card-ability .x    { color: var(--neon-pink); font-weight: bold; }
.card-ability .cash { color: var(--neon-green); font-weight: bold; }

/* ---------- FOOTER ---------- */
.card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    padding-top: 4px;
    border-top: 1px dashed rgba(246,201,72,0.25);
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    letter-spacing: 1px;
}

.cost {
    color: var(--neon-green);
    text-shadow: 0 0 6px rgba(76,255,125,0.6);
}

.cardno {
    color: rgba(255,255,255,0.4);
}

/* ---------- LEGENDARY HOLO ---------- */
.joker-card.legendary {
    background:
        linear-gradient(160deg, #2a0e15, #4a1820 60%, #1a0608);
    box-shadow:
        0 0 0 2px var(--gold),
        0 0 30px rgba(255,124,42,0.4),
        0 14px 0 -4px rgba(0,0,0,0.6),
        0 22px 40px -10px rgba(0,0,0,0.8),
        inset 0 0 30px rgba(0,0,0,0.5);
}

.joker-card.legendary .card-art {
    background:
        radial-gradient(ellipse at center, #6a2828 0%, #3a0e14 70%, #150405 100%);
}

.joker-card.legendary::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 14px;
    background: linear-gradient(45deg,
        var(--neon-red), var(--gold), var(--neon-pink), var(--neon-blue), var(--neon-red));
    background-size: 300% 300%;
    animation: holo 4s linear infinite;
    z-index: -1;
    opacity: 0.55;
    filter: blur(2px);
}
@keyframes holo {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

/* ---------- CARD ENTRANCE ---------- */
.joker-card {
    animation: dealIn 0.6s cubic-bezier(.2,.8,.3,1.2) backwards;
}
.joker-card:nth-child(1) { animation-delay: 0.05s; }
.joker-card:nth-child(2) { animation-delay: 0.15s; }
.joker-card:nth-child(3) { animation-delay: 0.25s; }
.joker-card:nth-child(4) { animation-delay: 0.35s; }
.joker-card:nth-child(5) { animation-delay: 0.45s; }
.joker-card:nth-child(6) { animation-delay: 0.55s; }
.joker-card:nth-child(7) { animation-delay: 0.65s; }
.joker-card:nth-child(8) { animation-delay: 0.75s; }
.joker-card:nth-child(9) { animation-delay: 0.85s; }
.joker-card:nth-child(10) { animation-delay: 0.95s; }
.joker-card:nth-child(11) { animation-delay: 1.05s; }
.joker-card:nth-child(12) { animation-delay: 1.15s; }

@keyframes dealIn {
    from {
        transform: translateY(-200px) rotateZ(-25deg) scale(0.5);
        opacity: 0;
    }
    to {
        transform: translateY(0) rotateZ(0) scale(1);
        opacity: 1;
    }
}

/* ---------- FOOTER STRIP ---------- */
.foot-strip {
    text-align: center;
    padding: 30px 20px 60px;
    font-family: 'Special Elite', cursive;
    color: rgba(245,230,200,0.5);
    font-size: 14px;
    letter-spacing: 2px;
    border-top: 2px dashed rgba(246,201,72,0.2);
    margin: 0 40px;
}
.foot-strip .stars { color: var(--gold); margin: 0 12px; }

/* ---------- RESPONSIVE ---------- */
@media (max-width: 480px) {
    .collection { gap: 20px; padding: 20px 12px 60px; }
    .neon-sign { font-size: 32px; }
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="marquee">
    <div class="neon-sign">
        <span class="red">JOKERS</span> OF <span class="blue">AMERICA</span>
    </div>
    <div class="subtitle">DEALER'S CHOICE COLLECTION</div>
    <div class="tagline">EST. 1986 · 52 PICKUP · NO REFUNDS</div>
</header>

<!-- ============ FILTER ============ -->
<nav class="filter-bar">
    <button class="filter-btn active" data-filter="all">ALL DECKS</button>
    <button class="filter-btn" data-filter="com">COMMON</button>
    <button class="filter-btn" data-filter="unc">UNCOMMON</button>
    <button class="filter-btn" data-filter="rar">RARE</button>
    <button class="filter-btn" data-filter="leg">LEGENDARY</button>
</nav>

<!-- ============ COLLECTION ============ -->
<section class="collection" id="collection">
    <!-- cards injected here -->
</section>

<div class="foot-strip">
    <span class="stars">★ ★ ★</span>
    HOUSE ALWAYS WINS · DRINK RESPONSIBLY · KEEP YOUR HANDS WHERE I CAN SEE 'EM
    <span class="stars">★ ★ ★</span>
</div>

<script>
/* =========================================================
   12 ORIGINAL JOKERS — Working class, blue-collar Americana
   Each one is a "guy you'd meet at the bar"
   ========================================================= */
const JOKERS = [
    {
        name: "GREASE MONKEY",
        emoji: "🔧",
        rarity: "com",
        ability: '<span class="chip">+30 Chips</span> for every <b>Spade</b> in played hand. Smells like motor oil.',
        cost: "$4",
        no: "001",
        tag: "Carl, 47 · Detroit MI",
        stamp: "BLUE COLLAR"
    },
    {
        name: "WHISKEY JESTER",
        emoji: "🥃",
        rarity: "unc",
        ability: 'After 3 hands played, gain <span class="x">X1.5 Mult</span>. Resets each round. <i>"One more, then I quit."</i>',
        cost: "$6",
        no: "002",
        tag: "Bourbon Street regular",
        stamp: "OPEN BAR"
    },
    {
        name: "ROAD HOG",
        emoji: "🏍️",
        rarity: "unc",
        ability: '<span class="mult">+8 Mult</span>. Doubles when you play 5 cards (full throttle).',
        cost: "$6",
        no: "003",
        tag: "Sturgis '92 veteran",
        stamp: "RIDE OR DIE"
    },
    {
        name: "DAD JOKER",
        emoji: "👨‍🦳",
        rarity: "com",
        ability: 'Earn <span class="cash">$2</span> at end of round. Tells the same joke every time.',
        cost: "$3",
        no: "004",
        tag: "Larry · 4 grandkids",
        stamp: "GROAN-INDUCING"
    },
    {
        name: "COACH BUDDY",
        emoji: "🏈",
        rarity: "rar",
        ability: 'When you play a <b>Flush</b>, retrigger all cards. <i>"That\'s what I\'m talkin\' about!"</i>',
        cost: "$8",
        no: "005",
        tag: "State Champ '88",
        stamp: "FOURTH DOWN"
    },
    {
        name: "SMOKEY THE CIGAR",
        emoji: "🚬",
        rarity: "rar",
        ability: '<span class="mult">+1 Mult</span> per round survived. Lifetime stat. Permanent.',
        cost: "$8",
        no: "006",
        tag: "30 yr / Cuban habit",
        stamp: "AGED 30YRS"
    },
    {
        name: "VEGAS VINNY",
        emoji: "🎰",
        rarity: "rar",
        ability: 'First card scored is retriggered <span class="x">3 times</span>. House always wins.',
        cost: "$8",
        no: "007",
        tag: "Sin City lounge act",
        stamp: "VIVA"
    },
    {
        name: "WILD WEST WALT",
        emoji: "🤠",
        rarity: "unc",
        ability: '<span class="chip">+50 Chips</span> on every <b>Ace</b>. Quick-draw style.',
        cost: "$5",
        no: "008",
        tag: "Tombstone, AZ",
        stamp: "DEAD OR ALIVE"
    },
    {
        name: "DINER MAMA",
        emoji: "🥧",
        rarity: "com",
        ability: 'Earn <span class="cash">$1</span> for each <b>Heart</b> played. Coffee is on the house.',
        cost: "$4",
        no: "009",
        tag: "Flo\'s Diner, Rt. 66",
        stamp: "OPEN 24/7"
    },
    {
        name: "TRUCKER ED",
        emoji: "🚛",
        rarity: "unc",
        ability: 'Long road bonus: <span class="mult">+15 Mult</span> if hand has 5 cards. Breaker breaker 1-9.',
        cost: "$6",
        no: "010",
        tag: "1.2M miles · no tickets",
        stamp: "10-4 GOOD BUDDY"
    },
    {
        name: "OL' GLORY",
        emoji: "🦅",
        rarity: "leg",
        ability: '<span class="x">X3 Mult</span> on hands containing both <b>red and black</b> suits. Land of the free.',
        cost: "$15",
        no: "011",
        tag: "Forged 1776",
        stamp: "★ LEGEND ★"
    },
    {
        name: "THE KINGPIN",
        emoji: "👑",
        rarity: "leg",
        ability: 'Every <b>Pair</b> becomes a <b>Three of a Kind</b>. Cigar in one hand, deck in the other.',
        cost: "$20",
        no: "012",
        tag: "Boss of bosses",
        stamp: "★ LEGEND ★"
    }
];

const RARITY_LABEL = {
    com: "COMMON",
    unc: "UNCOMMON",
    rar: "RARE",
    leg: "LEGENDARY"
};

function renderCards(filter) {
    const grid = document.getElementById('collection');
    grid.innerHTML = '';
    const list = filter === 'all' ? JOKERS : JOKERS.filter(j => j.rarity === filter);
    list.forEach(j => {
        const isLeg = j.rarity === 'leg';
        const el = document.createElement('div');
        el.className = 'joker-card' + (isLeg ? ' legendary' : '');
        el.innerHTML = `
            <div class="card-frame">
                <div class="card-head">
                    <div class="card-name">${j.name}</div>
                    <div class="rarity-badge ${j.rarity}">${RARITY_LABEL[j.rarity]}</div>
                </div>
                <div class="card-art">
                    <div class="art-stamp">${j.stamp}</div>
                    <div class="art-emoji">${j.emoji}</div>
                    <div class="art-tag">${j.tag}</div>
                </div>
                <div class="card-ability">${j.ability}</div>
                <div class="card-foot">
                    <span class="cost">${j.cost}</span>
                    <span class="cardno">№ ${j.no} / 052</span>
                </div>
            </div>
        `;
        grid.appendChild(el);
    });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.dataset.filter);
    });
});

renderCards('all');

/* 3D Tilt on mouse move */
document.addEventListener('mousemove', e => {
    document.querySelectorAll('.joker-card:hover').forEach(card => {
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = (e.clientX - cx) / rect.width;
        const dy = (e.clientY - cy) / rect.height;
        card.style.transform = `translateY(-12px) rotateY(${dx * 18}deg) rotateX(${-dy * 18}deg) scale(1.05)`;
    });
});
document.addEventListener('mouseout', e => {
    if (e.target.classList && e.target.classList.contains('joker-card')) {
        e.target.style.transform = '';
    }
});
</script>

</body>
</html>
